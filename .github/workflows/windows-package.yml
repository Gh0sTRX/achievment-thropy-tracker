name: Windows installer
on:
  pull_request:
    paths:
      - '.gitattributes'
      - 'atlas/**'
      - 'tests/**'
      - 'run.py'
      - 'requirements*.txt'
      - 'packaging/**'
      - 'scripts/**'
      - 'spec/**'
      - 'assets/**'
      - 'preview/**'
      - 'KURULUM.txt'
      - '.github/workflows/windows-package.yml'
  push:
    branches: [main, 'codex/public-profile-trophies']
    tags: ['v*']
    paths:
      - '.gitattributes'
      - 'atlas/**'
      - 'tests/**'
      - 'run.py'
      - 'requirements*.txt'
      - 'packaging/**'
      - 'scripts/**'
      - 'spec/**'
      - 'assets/**'
      - 'preview/**'
      - 'KURULUM.txt'
      - '.github/workflows/windows-package.yml'
  workflow_dispatch:
    inputs:
      promote_run_id:
        description: 'Optional: successful trusted PUSH run to promote without rebuilding'
        required: false
        type: string
concurrency:
  group: atlas-${{ github.workflow }}-${{ github.ref }}-${{ inputs.promote_run_id != '' && 'promotion' || 'build' }}
  # Superseded PR checks may stop; never interrupt an authorized push publication.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.promote_run_id == ''
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install platform SDKs and packager
        run: python -m pip install -r requirements-windows.txt
      - name: Embed build identity
        run: python scripts/generate_build_info.py
      - name: Run tests with real SDKs installed
        run: python -m unittest discover -s tests -v
      - name: Verify Ultimate UI projections
        run: |
          node --check atlas/web/inline.js
          node --check atlas/web/ui/ultimate.js
          node --check atlas/web/ui/shell.js
          node --check atlas/web/ui/foundation.js
          node tests/test_foundation_ui.cjs
          node tests/test_unified_shell.cjs
          node tests/test_ui_model.cjs
          node tests/test_art_transition.cjs
      - name: Validate update helper syntax
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/apply_update.ps1),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; throw 'Update helper syntax error' }
      - name: Verify failed-update snapshot recovery
        shell: powershell
        run: |
          ./tests/test_update_snapshot.ps1
          ./tests/test_update_crash_recovery.ps1
          ./tests/test_windows_download.ps1
      - name: Build standalone application
        run: python -m PyInstaller --noconfirm packaging/windows.spec
      - name: Sign application when a trusted certificate is configured
        shell: pwsh
        env:
          ATLAS_SIGNING_PFX: ${{ secrets.ATLAS_SIGNING_PFX }}
          ATLAS_SIGNING_PASSWORD: ${{ secrets.ATLAS_SIGNING_PASSWORD }}
        run: ./scripts/sign_windows.ps1 -TargetPath dist/AchievementAtlas/AchievementAtlas.exe -Report app-signing.json
      - name: Verify frozen application and Windows secret storage
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\AchievementAtlas\AchievementAtlas.exe -ArgumentList '--self-test','--report','frozen-test-report.json' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Frozen self-test failed: $($process.ExitCode)" }
          if (!(Test-Path frozen-test-report.json)) { throw 'Self-test report missing' }
      - name: Verify native desktop window
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\AchievementAtlas\AchievementAtlas.exe -ArgumentList '--desktop-test','--report','desktop-test-report.json' -PassThru
          if (!$process.WaitForExit(120000)) { $process.Kill(); throw 'Desktop window test timed out' }
          if ($process.ExitCode -ne 0 -or !(Test-Path desktop-test-report.json)) { if (Test-Path desktop-test-report.json) { Get-Content desktop-test-report.json }; throw 'Desktop window test failed' }
      - name: Build per-user installer
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) { throw 'Inno Setup compiler missing' }
          & $compiler packaging\windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Sign installer when a trusted certificate is configured
        shell: pwsh
        env:
          ATLAS_SIGNING_PFX: ${{ secrets.ATLAS_SIGNING_PFX }}
          ATLAS_SIGNING_PASSWORD: ${{ secrets.ATLAS_SIGNING_PASSWORD }}
        run: |
          $setup = Get-ChildItem dist/installer/*-Setup.exe | Select-Object -First 1
          ./scripts/sign_windows.ps1 -TargetPath $setup.FullName -Report dist/installer/installer-signing.json
      - name: Generate verified update channel manifest
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/installer/*-Setup.exe | Select-Object -First 1
          python scripts/build_update_manifest.py $setup.FullName
      - name: Record Windows Defender scan when available
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/installer/*-Setup.exe | Select-Object -First 1
          ./scripts/scan_windows.ps1 -TargetPath $setup.FullName -Report dist/installer/defender-report.json
      - name: Verify installed application
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\installer\*-Setup.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'Atlas install smoke test'
          $process = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$installDir`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $process = Start-Process (Join-Path $installDir 'AchievementAtlas.exe') -ArgumentList '--self-test','--report','installed-test-report.json' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0 -or !(Test-Path installed-test-report.json)) { throw 'Installed self-test failed' }
          $process = Start-Process (Join-Path $installDir 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Uninstall failed' }
      - name: Verify real old-to-new native installer upgrades and rollback
        shell: powershell
        run: |
          $setup = Get-ChildItem dist/installer/*-Setup.exe | Select-Object -First 1
          $test = Start-Process powershell.exe -ArgumentList '-NoProfile','-NonInteractive','-MTA','-File','tests/test_windows_upgrade.ps1','-SetupPath',('"'+$setup.FullName+'"'),'-ReportPath','upgrade-test-report.json' -PassThru -NoNewWindow
          $null = $test.Handle
          if (!$test.WaitForExit(360000)) { $test.Kill(); throw 'Native upgrade matrix timed out' }
          $test.WaitForExit()
          if ($test.ExitCode -ne 0) { throw 'Native upgrade matrix failed' }
      - name: Preserve upgrade diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-upgrade-failure-reports
          path: '*update-test-report.json'
          if-no-files-found: ignore
      - name: Prepare portable app, setup and checksums
        shell: pwsh
        run: |
          Copy-Item KURULUM.txt dist\AchievementAtlas\
          Copy-Item LICENSE dist\AchievementAtlas\
          New-Item -ItemType Directory -Path dist/AchievementAtlas/docs -Force | Out-Null
          Copy-Item docs/PUBLIC_PROFILES_TR.md,docs/UPDATE_CRASH_RECOVERY_TR.md,docs/UPDATE_ROLLBACK_SNAPSHOT_TR.md,docs/RELEASE_NOTES_0_16_0_TR.md dist/AchievementAtlas/docs/
          Compress-Archive dist\AchievementAtlas -DestinationPath dist\installer\AchievementAtlas-0.16.0-Windows-x64-Portable.zip
          Compress-Archive preview -DestinationPath dist\installer\AchievementAtlas-0.16.0-Preview.zip
          Copy-Item app-signing.json dist/installer/
          Copy-Item frozen-test-report.json,installed-test-report.json,desktop-test-report.json,upgrade-test-report.json dist\installer\
          Get-ChildItem dist\installer\*.exe,dist\installer\*.zip | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content dist\installer\SHA256SUMS.txt
          python -m pip freeze | Set-Content dist\installer\dependencies.txt
      - name: Attest push-built development installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/public-profile-trophies'
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/installer/*-Setup.exe
      - name: Prepare authenticated development candidate without publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/public-profile-trophies'
        shell: pwsh
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          Copy-Item $env:BUNDLE_PATH dist/installer/update-bundle.json
          python scripts/build_dev_manifest.py dist/installer
      - uses: actions/upload-artifact@v4
        with:
          name: AchievementAtlas-0.16.0-Windows-x64
          path: dist/installer/*
          retention-days: 30
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, native-self-update]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AchievementAtlas-0.16.0-Windows-x64
          path: release-files
      - name: Require a signed, matching stable release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYTHON'
          import json,os,hashlib
          from pathlib import Path
          root=Path('release-files')
          manifest=json.loads((root/'update-manifest.json').read_text())
          assert manifest['signed'] is True, 'Unsigned development artifacts cannot become automatic updates'
          assert os.environ['RELEASE_TAG']=='v'+manifest['version'], 'Tag/version mismatch'
          installer=root/manifest['installer']
          assert installer.stat().st_size==manifest['size']
          assert hashlib.sha256(installer.read_bytes()).hexdigest()==manifest['sha256']
          PYTHON
      - name: Publish stable GitHub update channel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-files/* --verify-tag --title "Achievement Atlas $RELEASE_TAG" --generate-notes


  promote-development:
    if: github.event_name == 'workflow_dispatch' && inputs.promote_run_id != '' && github.ref == 'refs/heads/codex/public-profile-trophies'
    concurrency:
      group: atlas-development-promotion
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CANDIDATE_RUN_ID: ${{ inputs.promote_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require successful trusted push run
        run: |
          python - <<'PY'
          import json,os,re,subprocess
          run=os.environ['CANDIDATE_RUN_ID']
          if not re.fullmatch(r'[1-9][0-9]*',run): raise SystemExit('Invalid run ID')
          data=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GH_REPO"]}/actions/runs/{run}']))
          assert data['event']=='push' and data['conclusion']=='success'
          assert data['head_branch']=='codex/public-profile-trophies'
          assert data['path']=='.github/workflows/windows-package.yml'
          assert data['head_repository']['full_name']==os.environ['GH_REPO']
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('CANDIDATE_COMMIT='+data['head_sha']+'\n')
          PY
      - name: Download original artifact without rebuilding
        run: gh run download "$CANDIDATE_RUN_ID" --pattern 'AchievementAtlas-*-Windows-x64' --dir release-files
      - name: Verify original installer, manifest and push provenance
        run: |
          python -m pip install -r requirements-updates.txt
          python scripts/verify_development_candidate.py release-files
      - name: Publish verified development candidate
        run: |
          if ! gh release view development >/dev/null 2>&1; then
            gh release create development --target "$CANDIDATE_COMMIT" --prerelease --title 'Achievement Atlas — Development' --notes 'GitHub push provenance verified. Windows Authenticode signing may be absent.'
          fi
          gh release upload development release-files/*-Setup.exe release-files/SHA256SUMS.txt release-files/update-bundle.json release-files/development-verification.json --clobber
          gh release upload development release-files/development-manifest.json --clobber

  publish-authorized-push:
    # Explicit release commit marker; ordinary pushes only build candidates.
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/public-profile-trophies' && contains(github.event.head_commit.message, '[publish-development]')
    needs: [build, native-self-update]
    runs-on: ubuntu-latest
    concurrency:
      group: atlas-development-promotion
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CANDIDATE_RUN_ID: ${{ github.run_id }}
      CANDIDATE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: AchievementAtlas-0.16.0-Windows-x64
          path: release-files
      - name: Reverify the exact successful push build
        run: |
          python -m pip install -r requirements-updates.txt
          python scripts/verify_development_candidate.py release-files
      - name: Publish explicitly authorized development update
        run: |
          if gh release view development >/dev/null 2>&1; then
            gh release edit development --prerelease --title 'Achievement Atlas 0.16.0 — Development' --notes-file docs/RELEASE_NOTES_0_16_0_TR.md
          else
            gh release create development --target "$CANDIDATE_COMMIT" --prerelease --title 'Achievement Atlas 0.16.0 — Development' --notes-file docs/RELEASE_NOTES_0_16_0_TR.md
          fi
          gh release upload development release-files/*-Setup.exe release-files/SHA256SUMS.txt release-files/update-bundle.json release-files/development-verification.json --clobber
          gh release upload development release-files/development-manifest.json --clobber

  native-self-update:
    if: github.event_name != 'workflow_dispatch' || inputs.promote_run_id == ''
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Exercise shipped native update buttons through verified restart
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -MTA -File ./tests/test_windows_self_update.ps1 -ReportPath self-update-test-report.json
          if ($LASTEXITCODE -ne 0) { throw 'Native self-update test failed' }
      - name: Preserve native self-update result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-native-self-update-report
          overwrite: true
          path: self-update-test-report.json
          if-no-files-found: warn
