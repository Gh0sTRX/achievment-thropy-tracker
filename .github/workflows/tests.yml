name: Unit tests
on:
  push:
  pull_request:
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install image validation library
        run: python -m pip install "Pillow>=11,<13" -r requirements-updates.txt
      - name: Unit and local HTTP integration tests
        run: python -m unittest discover -s tests -v
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check atlas/web/provider_setup.js
          node --check atlas/web/achievement_row.js
          node --check atlas/web/app.js
          node --check atlas/web/visuals.js
          node --check atlas/web/ultimate.js
          node --check atlas/web/ui/ultimate.js
          node --check atlas/web/ui/shell.js
          node --check atlas/web/ui/foundation.js
          node --check atlas/web/ui/motion.js
          node --check atlas/web/ui/search.js
          node tests/test_foundation_ui.cjs
          node tests/test_unified_shell.cjs
          node --check atlas/web/inline.js
          node --check atlas/web/model.js
          node tests/test_ui_model.cjs
          node --check atlas/web/art_transition.js
          node tests/test_art_transition.cjs
  update-recovery:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Exercise real updater recovery functions
        shell: pwsh
        run: |
          ./tests/test_update_snapshot.ps1
          ./tests/test_update_crash_recovery.ps1
          ./tests/test_windows_download.ps1
          ./tests/test_native_ui_match.ps1
      - name: Verify Windows PowerShell compatibility
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./tests/test_update_snapshot.ps1
          ./tests/test_update_crash_recovery.ps1
          ./tests/test_windows_download.ps1
          ./tests/test_native_ui_match.ps1

  native-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test tools
        run: |
          python -m pip install "Pillow>=11,<13"
          npm install --prefix "$RUNNER_TEMP/atlas-browser" --no-save playwright@1.62.1
          "$RUNNER_TEMP/atlas-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Native routes, search, themes, controller and large libraries
        shell: bash
        run: |
          export NODE_PATH="$RUNNER_TEMP/atlas-browser/node_modules"
          export ATLAS_CHROMIUM="$(node -p "require('playwright').chromium.executablePath()")"
          python tests/audit_fixture_server.py > "$RUNNER_TEMP/atlas-fixture.log" 2>&1 &
          atlas_fixture_pid=$!
          trap 'kill "$atlas_fixture_pid" 2>/dev/null || true' EXIT
          python -c "import pathlib,time; p=pathlib.Path('work/audit/fixture-urls.json'); deadline=time.monotonic()+30; exec('while not p.exists() and time.monotonic()<deadline: time.sleep(.2)'); assert p.exists(), 'Fixture startup timed out'"
          node tests/test_game_universe.cjs
          node tests/test_native_search.cjs
          node tests/test_native_themes.cjs
          node tests/test_native_history.cjs
          node tests/test_offline_archive.cjs
          node tests/test_issue22_setup.cjs
          node tests/test_achievement_hit_area.cjs
          node tests/test_console_layout.cjs
          node tests/test_console_return.cjs
          node tests/test_artwork_health_ui.cjs
          node tests/test_cover_inventory_ui.cjs
          node tests/test_cover_recovery_ui.cjs
          node tests/test_next_moves.cjs
          node tests/test_issue22_metadata.cjs
          node tests/test_library_transfer.cjs
          node tests/browser_audit.cjs
      - name: Preserve synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-browser-audit
          if-no-files-found: warn
          path: |
            work/audit/browser-results.json
            work/audit/game-universe-results.json
            work/audit/server-performance.json
            work/audit/native-*.png
            work/audit/cover-*.json
