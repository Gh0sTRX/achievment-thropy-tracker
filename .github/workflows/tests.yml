name: Unit tests
on:
  push:
  pull_request:
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install image validation library
        run: python -m pip install "Pillow>=11,<13" -r requirements-updates.txt
      - name: Unit and local HTTP integration tests
        run: python -m unittest discover -s tests -v
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check atlas/web/app.js
          node --check atlas/web/visuals.js
          node --check atlas/web/ultimate.js
          node --check atlas/web/ui/ultimate.js
          node --check atlas/web/ui/shell.js
          node --check atlas/web/ui/foundation.js
          node --check atlas/web/ui/motion.js
          node tests/test_foundation_ui.cjs
          node tests/test_unified_shell.cjs
          node --check atlas/web/inline.js
          node --check atlas/web/model.js
          node tests/test_ui_model.cjs
          node --check atlas/web/art_transition.js
          node tests/test_art_transition.cjs
  update-recovery:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Exercise real updater recovery functions
        shell: pwsh
        run: ./tests/test_update_snapshot.ps1
      - name: Verify Windows PowerShell compatibility
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/test_update_snapshot.ps1
